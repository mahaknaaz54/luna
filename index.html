<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>luna-ui</title>
  <script>
    window.onerror = (msg, url, line, col, error) => {
      const div = document.createElement('div');
      div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:red;padding:20px;z-index:99999;overflow:auto;font-family:monospace;';
      div.innerHTML = `<h1>Application Error</h1>
          <p><strong>Message:</strong> ${msg}</p>
          <p><strong>Source:</strong> ${url}:${line}:${col}</p>
          <pre>${error?.stack || ''}</pre>
          <p>Please send a screenshot of this to the AI assistant.</p>`;
      document.body.appendChild(div);
    };
  </script>
</head>

<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#666;">
      Authenticating and connecting to Luna...
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>

</html>
